[workspace]
members = ["crates/demo", "crates/private/demo-core"]

[workspace.metadata.soldr]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
# RUST-019 (#413): the async guard lints, at deny as the fleet rule requires.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
