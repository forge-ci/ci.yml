name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  precheck:
    uses: ./.github/workflows/ci-pre.yml
  fast:
    needs: precheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
        with:
          repository: zackees/ci.yml
          ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          path: ci.yml
      - run: python3 ci/build.py
      - run: uv run --no-project ruff check .
      - run: uv run --no-project ruff format --check .
      - run: uv run --no-project pylint src
      - run: soldr cargo check --locked --target x86_64-unknown-linux-gnu
      - run: soldr cargo check --locked --target x86_64-unknown-linux-musl
      - run: soldr cargo check --locked --target x86_64-pc-windows-msvc
      - run: soldr cargo check --locked --target aarch64-pc-windows-msvc
  cache-janitor:
    needs: fast
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: { group: cache-janitor, cancel-in-progress: false }
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - run: python3 -m ci_lint cache janitor --repo .
