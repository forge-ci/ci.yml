schema  = 3
profile = "rust-pypi-app"
linter  = "zackees/ci.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[platforms]
linux-x64   = { target = "x86_64-unknown-linux-gnu", runs-on = "ubuntu-24.04", group = "linux" }
windows-x64 = { target = "x86_64-pc-windows-msvc",   runs-on = "windows-2025", group = "windows" }

[python]
backend = "soldr"
cli     = { name = "demo-cli", crate = "demo-cli", native = true }
abi3    = "cp310"
pythons = ["3.11"]

[rust]
public  = "crates/demo"
private = "crates/private/*"
ship    = [[]]

[rust.tests]
max-binary = "40MB"
max-total  = "100MB"
binaries   = ["demo-core:lib"]

[lint.dylint]
targets = "all-platforms"
shape   = "measure"
budget  = { warm = "60s", cold = "120s" }

[suites]
unit        = { run = "ci/test.py unit",        required = true }
smoke       = { run = "ci/wheel.py smoke",      required = true }
integration = { run = "ci/test.py integration" }
perf        = { run = "ci/perf.py", kind = "bench", gating = false }

[flow.pr]
platforms = ["linux-x64"]
suites    = ["unit", "smoke"]
dylint    = "all-platforms"
budget    = { critical-path = "8m" }

[flow.main]
extends   = "pr"
cache     = "write"
pre-prune = true

[flow.release]
platforms = "all"
suites    = "all"
wheels    = "all"
publish   = "pypi"

[flow.nightly]
extends   = "release"
schedule  = "daily"
cache     = "write"
janitor   = true
publish   = "none"
pre-prune = true

[tags]
ci-full       = { add = { platforms = "all", suites = ["integration"] } }
ci-perf       = { add = { suites = ["perf"] } }
ci-cache-save = { cache = "pr-base" }
no-test       = { remove = { suites = "tests" } }
release       = { flow = "release", publish = "rehearsal" }

[cache]
budget   = "9GB"
write-on = ["main", "nightly"]
never    = ["linked-tests", "nextest-archives", "wheels", "incremental", "target-dir", "perf-results"]
retired  = ["solo-toolchain", "cook-delta-v2"]
pr       = { mode = "delta", families = ["compile"], max-per-pr = "128MB", budget = "1GB", trim = "on-close" }

[cache.family]
registry = { via = "setup-soldr:cargo-registry", max = "10MB", lockfile = true }
compile  = { via = "setup-soldr:build-cache",    max = "10MB", lockfile = true, per = "platform" }
uv       = { via = "ci-lint", key = ["os", "python", "uv.lock"], max = "10MB", per = "os" }

[local]
runner = "bosn-act"
lanes  = ["precheck", "fast", "dylint"]
cache  = "machine"

[allow]
workflows         = { "ci.yml" = ["pull_request", "push:main", "schedule", "workflow_dispatch"], "ci-pre.yml" = ["workflow_call"] }
actions           = ["actions/checkout", "actions/upload-artifact", "actions/download-artifact", "zackees/setup-soldr", "astral-sh/setup-uv"]
setup-soldr       = { only-in = ".github/actions/soldr", require = { solo-toolchain-cache = "false", cook-delta = "false", save-cache = "auto" } }
tools             = ["soldr", "uv", "python3", "yq", "git"]
secrets           = []
platform-selector = "crates/private/demo-platform/src/lib.rs"
platform-code     = ["crates/private/demo-platform/src/platforms/**"]

[publish]
pypi = { auth = "oidc", environment = "pypi", mode = "mock" }

[[exceptions]]
rule    = "GEN-005"
path    = "ci.sh"
reason  = "Gate launcher kept for now (owner-approved); replace with a Python entry point."
issue   = "https://github.com/zackees/template-python-rust-cmd/issues/15"
expires = "2099-12-31"
