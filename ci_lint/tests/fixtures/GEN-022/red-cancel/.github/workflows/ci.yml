name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  cancel-superseded:
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: write }
    steps:
      - run: python3 ci/cancel_superseded.py
  build:
    runs-on: ubuntu-24.04
    steps:
      - run: echo build
  test:
    needs: [build, cancel-superseded]
    runs-on: ubuntu-24.04
    steps:
      - run: echo test
  cache-janitor:
    needs: [test, cancel-superseded]
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    concurrency: { group: cache-janitor, cancel-in-progress: false }
    steps:
      - run: python3 -m ci_lint cache janitor --repo .
